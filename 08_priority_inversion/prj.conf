# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# Lower number = higher priority. H 2, M 3, L 4.
# main() prints the trace of each cycle after it ends: least urgent.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Timing measurements (the DWT cycle counter on the Cortex-M7) ---
CONFIG_TIMING_FUNCTIONS=y

# --- Debugging ---
CONFIG_ASSERT=y

# --- The lock: uncomment exactly one line ---
CONFIG_APP_LOCK_SEM=y
# CONFIG_APP_LOCK_MUTEX=y
# CONFIG_APP_LOCK_CEILING=y

# Experiment B1: cap priority inheritance (kernel option; default -127 = no cap).
# CONFIG_PRIORITY_CEILING=4

# --- Common options (see Kconfig) ---
CONFIG_APP_REPORT_PERIOD_MS=3000
CONFIG_APP_DEBOUNCE_MS=50

# --- The scenario (Lesson 11), in units of CONFIG_APP_UNIT_MS ---
CONFIG_APP_UNIT_MS=100
CONFIG_APP_L_BEFORE=1
CONFIG_APP_L_INSIDE=4
CONFIG_APP_L_AFTER=1
CONFIG_APP_H_RELEASE=2
CONFIG_APP_H_BEFORE=1
CONFIG_APP_H_INSIDE=2
CONFIG_APP_H_AFTER=1
CONFIG_APP_M_RELEASE=3
CONFIG_APP_M_WORK=6
CONFIG_APP_BUTTON_EXTRA=5
