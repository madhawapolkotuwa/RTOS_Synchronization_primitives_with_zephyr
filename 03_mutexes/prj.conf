# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() blinks a heartbeat LED and prints reports: least urgent priority.
# Lower number = higher priority. Accelerometer thread: 4, temperature thread: 6.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Debugging ---
# Catches illegal kernel calls, e.g. a mutex used in an ISR (experiment 5).
CONFIG_ASSERT=y

# --- What protects the bus: uncomment exactly one line ---
CONFIG_APP_LOCK_MUTEX=y
# CONFIG_APP_LOCK_SEMAPHORE=y
# CONFIG_APP_LOCK_NONE=y

# --- Tutorial options (see Kconfig) ---
CONFIG_APP_BUS_STEP_US=100
CONFIG_APP_LOCK_TIMEOUT_MS=100
CONFIG_APP_ACCEL_WORK_IN_LOCK_MS=0
CONFIG_APP_OWNERSHIP_TOUR=y
CONFIG_APP_REPORT_PERIOD_MS=2000
