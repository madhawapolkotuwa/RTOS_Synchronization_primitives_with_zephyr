# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() blinks a heartbeat LED and prints reports: least urgent priority.
# Lower number = higher priority. Part A's handler runs at 2, Part B's senders at 5.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Debugging ---
CONFIG_ASSERT=y

# --- Which demo: uncomment exactly one line ---
CONFIG_APP_DEMO_EVENTS=y
# CONFIG_APP_DEMO_POOL=y

# --- Part A options (see Kconfig) ---
CONFIG_APP_EVENT_SEM_LIMIT=10
CONFIG_APP_PROCESSING_MS=100
CONFIG_APP_BURST_SIZE=8
CONFIG_APP_BURST_GAP_MS=10
CONFIG_APP_BURST_PERIOD_MS=3000
CONFIG_APP_FLUSH_THRESHOLD=0

# --- Part B options (see Kconfig) ---
CONFIG_APP_POOL_SIZE=4
CONFIG_APP_SENDER_PERIOD_MS=200
CONFIG_APP_TX_TIME_MS=300
CONFIG_APP_ALLOC_TIMEOUT_MS=1000
CONFIG_APP_REPORT_PERIOD_MS=2000
