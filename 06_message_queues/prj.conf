# --- Kernel objects ---
# k_msgq, k_fifo and k_mem_slab are always available: nothing to enable.

# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() blinks a heartbeat LED and prints reports: least urgent priority.
# Lower number = higher priority.
#   Part A: other work 2, processing thread 5.
#   Part B: consumer 5.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Debugging ---
CONFIG_ASSERT=y

# --- Which demo: uncomment exactly one line ---
CONFIG_APP_DEMO_SENSOR=y
# CONFIG_APP_DEMO_PACKETS=y

# --- Common options (see Kconfig) ---
CONFIG_APP_REPORT_PERIOD_MS=2000
CONFIG_APP_DEBOUNCE_MS=50

# --- Part A options ---
CONFIG_APP_SAMPLE_PERIOD_US=1000
CONFIG_APP_QUEUE_DEPTH=16
CONFIG_APP_PROCESS_US=300
CONFIG_APP_BLOCK_PERIOD_MS=100
CONFIG_APP_BLOCK_MS=9
CONFIG_APP_BUTTON_BLOCK_MS=30
# Full-queue policy: uncomment exactly one line.
CONFIG_APP_POLICY_DROP_NEWEST=y
# CONFIG_APP_POLICY_DROP_OLDEST=y
# Experiment A4:
# CONFIG_APP_ISR_PUT_WAIT=y

# --- Part B options ---
CONFIG_APP_PACKET_PERIOD_MS=10
CONFIG_APP_POOL_BLOCKS=8
CONFIG_APP_HANDLE_MS=4
CONFIG_APP_STALL_MS=50
# Experiments: uncomment one at a time.
# CONFIG_APP_FORGET_FREE=y
# CONFIG_APP_TOUCH_AFTER_SEND=y
# CONFIG_APP_FIFO_NO_RESERVED=y
