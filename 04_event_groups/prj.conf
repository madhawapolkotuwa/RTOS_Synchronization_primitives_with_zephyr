# --- Kernel objects ---
# k_event is optional in Zephyr: without this, K_EVENT_DEFINE does not exist.
CONFIG_EVENTS=y

# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() blinks a heartbeat LED and prints reports: least urgent priority.
# Lower number = higher priority.
#   Part A: worker 3, init and link threads 5.
#   Part B: dispatcher 2, logger 4 (optional), data producer 5.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Debugging ---
CONFIG_ASSERT=y

# --- Which demo: uncomment exactly one line ---
CONFIG_APP_DEMO_GATE=y
# CONFIG_APP_DEMO_DISPATCH=y

# --- Common options (see Kconfig) ---
CONFIG_APP_REPORT_PERIOD_MS=2000
CONFIG_APP_DEBOUNCE_MS=50

# --- Part A options ---
CONFIG_APP_SENSOR_INIT_MS=300
CONFIG_APP_CONFIG_INIT_MS=800
CONFIG_APP_LINK_INIT_MS=1500
CONFIG_APP_LINK_UP_TIME_MS=3000
CONFIG_APP_LINK_DOWN_TIME_MS=2000
CONFIG_APP_TRANSFER_MS=200
CONFIG_APP_GATE_TIMEOUT_MS=1000
# Experiments: uncomment one at a time.
# CONFIG_APP_GATE_WAIT_ANY=y
# CONFIG_APP_GATE_RESET=y
# CONFIG_APP_LINK_USE_SET=y

# --- Part B options ---
CONFIG_APP_TICK_PERIOD_MS=1000
CONFIG_APP_DATA_PERIOD_MS=300
CONFIG_APP_HANDLE_MS=50
# Experiments: uncomment as described in the README.
# CONFIG_APP_CLEAR_AFTER_HANDLING=y
# CONFIG_APP_BUTTON_LOGGER=y
CONFIG_APP_LOGGER_PRIORITY=4
