# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() only blinks a heartbeat LED, so it gets the least urgent priority.
# Lower number = higher priority; the handler thread uses priority 2.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Debugging ---
# Catches illegal kernel calls, e.g. a blocking k_sem_take() in an ISR (experiment 6).
CONFIG_ASSERT=y

# --- Tutorial options (see Kconfig) ---
CONFIG_APP_PROCESSING_MS=1000
CONFIG_APP_TAKE_TIMEOUT_MS=5000
CONFIG_APP_TIMER_PERIOD_MS=0
