# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() blinks a heartbeat LED and prints reports: least urgent of the app.
# Lower number = higher priority.
#   SPI gatekeeper 3 (fix B3 only), display 4, logger 5.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Diagnosis: the kernel shell on the console UART ---
# Type "kernel thread list" (or "kernel threads" on older trees) at the
# uart:~$ prompt to see every thread's state and priority.
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# --- Recovery net: the task watchdog (software timer, no hardware watchdog) ---
CONFIG_TASK_WDT=y

# --- Debugging ---
CONFIG_ASSERT=y

# --- The fix: uncomment exactly one line ---
CONFIG_APP_FIX_NONE=y
# CONFIG_APP_FIX_LOCK_ORDER=y
# CONFIG_APP_FIX_TIMEOUT=y
# CONFIG_APP_FIX_GATEKEEPER=y

# --- Common options (see Kconfig) ---
CONFIG_APP_REPORT_PERIOD_MS=2000
CONFIG_APP_DEBOUNCE_MS=50

# --- Timing ---
CONFIG_APP_DISPLAY_PERIOD_MS=50
CONFIG_APP_HALF_FRAME_MS=5
CONFIG_APP_GLYPH_MS=1
CONFIG_APP_LOGGER_PERIOD_MS=100
# Experiment A3: 2 makes every log write collide with a frame.
CONFIG_APP_LOGGER_OFFSET_MS=25
CONFIG_APP_OPEN_MS=2
CONFIG_APP_WRITE_MS=2

# --- Fix B2 ---
CONFIG_APP_LOCK_TIMEOUT_MS=10
CONFIG_APP_BACKOFF_MS=3

# --- Detection and recovery ---
CONFIG_APP_WDT_TIMEOUT_MS=1000
# Experiment A4:
# CONFIG_APP_WDT_REBOOT=y
# Experiment A5 (with CONFIG_APP_FIX_NONE):
# CONFIG_APP_CHECK_LOCK_ORDER=y
