# --- Kernel objects ---
# Nothing to enable by hand: Kconfig selects CONFIG_EVENTS for the k_event
# mechanism and CONFIG_POLL for the k_poll_signal one (Part B selects both).
# k_sem and k_wakeup() are always available.

# --- Drivers ---
CONFIG_GPIO=y

# --- Scheduling ---
# main() blinks a heartbeat LED and prints reports: least urgent priority.
# Lower number = higher priority.
#   Part A: driver 2.
#   Part B: the four receivers 3.
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_THREAD_NAME=y

# --- Debugging ---
CONFIG_ASSERT=y

# --- Which demo: uncomment exactly one line ---
CONFIG_APP_DEMO_DRIVER=y
# CONFIG_APP_DEMO_BENCH=y

# --- Common options (see Kconfig) ---
CONFIG_APP_REPORT_PERIOD_MS=2000
CONFIG_APP_DEBOUNCE_MS=50

# --- Part A: the notification mechanism, uncomment exactly one line ---
CONFIG_APP_NOTIFY_SEM=y
# CONFIG_APP_NOTIFY_EVENT=y
# CONFIG_APP_NOTIFY_POLL_SIGNAL=y
# CONFIG_APP_NOTIFY_WAKEUP=y

# --- Part A options ---
CONFIG_APP_TRANSFER_PERIOD_MS=100
CONFIG_APP_DMA_TIME_MS=5
CONFIG_APP_DMA_TIMEOUT_MS=20
CONFIG_APP_ERROR_EVERY=10
# Experiment A2: CONFIG_APP_SETUP_US=3000 and CONFIG_APP_DMA_TIME_MS=1
CONFIG_APP_SETUP_US=0
# Experiment A4: uncomment to stop discarding leftover signals.
# CONFIG_APP_RESET_BEFORE_START=n

# --- Part B options ---
CONFIG_APP_BENCH_PERIOD_MS=500
CONFIG_APP_BENCH_BURST=2
CONFIG_APP_BENCH_LATE_MS=10
CONFIG_APP_BENCH_HANDLE_MS=50
