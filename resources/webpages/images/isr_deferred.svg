<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <title>Deferred interrupt processing</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#30343f"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1d232b">Deferred interrupt processing: short ISR, work in a thread</text>

  <!-- row labels -->
  <g font-weight="700" fill="#1d232b" font-size="12.5">
    <text x="14" y="78">IRQ line</text>
    <text x="14" y="128">ISR</text>
    <text x="14" y="178">Handler thread</text>
    <text x="14" y="193" font-weight="400" fill="#5b6573">(high priority)</text>
    <text x="14" y="238">Application</text>
    <text x="14" y="253" font-weight="400" fill="#5b6573">thread (lower)</text>
  </g>
  <g stroke="#d9dee5">
    <line x1="130" y1="96" x2="840" y2="96"/><line x1="130" y1="146" x2="840" y2="146"/>
    <line x1="130" y1="206" x2="840" y2="206"/><line x1="130" y1="266" x2="840" y2="266"/>
  </g>

  <!-- IRQ signal -->
  <path d="M130,84 L240,84 L240,64 L270,64 L270,84 L840,84" fill="none" stroke="#30343f" stroke-width="2"/>
  <text x="255" y="58" text-anchor="middle" font-size="11.5" fill="#1d232b">device event</text>

  <!-- app thread running, preempted -->
  <rect x="130" y="222" width="112" height="30" fill="#00798c"/>
  <rect x="242" y="232" width="368" height="10" fill="#00798c" opacity="0.28"/>
  <rect x="610" y="222" width="230" height="30" fill="#00798c"/>
  <text x="186" y="241" text-anchor="middle" fill="#fff" font-size="12">running</text>
  <text x="725" y="241" text-anchor="middle" fill="#fff" font-size="12">resumes</text>
  <text x="426" y="262" text-anchor="middle" font-size="11.5" fill="#5b6573">ready, preempted</text>

  <!-- ISR -->
  <rect x="244" y="112" width="44" height="30" fill="#30343f"/>
  <text x="266" y="131" text-anchor="middle" fill="#fff" font-size="12">ISR</text>
  <g font-size="11.5" fill="#1d232b">
    <text x="300" y="112">1. clear/acknowledge the interrupt source</text>
    <text x="300" y="127">2. copy the data out of the peripheral</text>
    <text x="300" y="142">3. give semaphore / post to queue / submit work item</text>
  </g>

  <!-- signal arrow -->
  <path d="M288,142 Q300,170 304,166" fill="none" stroke="#30343f" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- handler thread -->
  <rect x="306" y="162" width="304" height="30" fill="#8e44ad"/>
  <text x="458" y="181" text-anchor="middle" fill="#fff" font-size="12">parse, filter, compute, call blocking APIs, log</text>

  <!-- annotations -->
  <g font-size="11.5" fill="#5b6573">
    <line x1="244" y1="292" x2="288" y2="292" stroke="#30343f"/>
    <line x1="244" y1="286" x2="244" y2="298" stroke="#30343f"/><line x1="288" y1="286" x2="288" y2="298" stroke="#30343f"/>
    <text x="266" y="314" text-anchor="middle">microseconds</text>
    <line x1="306" y1="292" x2="610" y2="292" stroke="#30343f"/>
    <line x1="306" y1="286" x2="306" y2="298" stroke="#30343f"/><line x1="610" y1="286" x2="610" y2="298" stroke="#30343f"/>
    <text x="458" y="314" text-anchor="middle">bulk of the work, at a priority the designer chooses, interruptible</text>
  </g>
</svg>
