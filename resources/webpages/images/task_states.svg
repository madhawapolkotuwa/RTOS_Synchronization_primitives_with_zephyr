<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="13">
  <title>Task state machine</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#30343f"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1d232b">Task states and transitions</text>

  <!-- states -->
  <g font-weight="700" font-size="15" text-anchor="middle">
    <rect x="85" y="112" width="150" height="56" rx="12" fill="#e6efff" stroke="#1f6feb" stroke-width="2"/>
    <text x="160" y="145" fill="#1d232b">Ready</text>
    <rect x="485" y="112" width="150" height="56" rx="12" fill="#e6f4ea" stroke="#1a7f37" stroke-width="2"/>
    <text x="560" y="145" fill="#1d232b">Running</text>
    <rect x="285" y="292" width="150" height="56" rx="12" fill="#fff6dd" stroke="#9a6700" stroke-width="2"/>
    <text x="360" y="318" fill="#1d232b">Blocked</text>
    <text x="360" y="336" font-size="11" font-weight="400" fill="#5b6573">(pending / waiting)</text>
    <rect x="35" y="292" width="150" height="56" rx="12" fill="#f0f2f5" stroke="#5b6573" stroke-width="2"/>
    <text x="110" y="325" fill="#1d232b">Suspended</text>
    <rect x="565" y="292" width="150" height="56" rx="12" fill="#fde8ec" stroke="#c4314b" stroke-width="2"/>
    <text x="640" y="325" fill="#1d232b">Terminated</text>
  </g>

  <g fill="none" stroke="#30343f" stroke-width="2" marker-end="url(#arr)">
    <path d="M235,128 L483,128"/>
    <path d="M485,152 L237,152"/>
    <path d="M560,168 Q545,280 437,316"/>
    <path d="M285,316 Q185,290 172,170"/>
    <path d="M110,168 L110,290"/>
    <path d="M140,292 L140,170"/>
    <path d="M605,168 L635,290"/>
  </g>

  <g fill="#1d232b" font-size="12">
    <text x="360" y="120" text-anchor="middle">dispatched by the scheduler</text>
    <text x="360" y="170" text-anchor="middle">preempted · yields · time slice expires</text>
    <text x="546" y="228" text-anchor="end">waits on an object</text>
    <text x="546" y="243" text-anchor="end">(take, lock, receive)</text>
    <text x="546" y="258" text-anchor="end">or sleeps</text>
    <text x="250" y="232" text-anchor="middle">object becomes</text>
    <text x="250" y="247" text-anchor="middle">available, or</text>
    <text x="250" y="262" text-anchor="middle">timeout expires</text>
    <text x="104" y="234" text-anchor="end">suspend</text>
    <text x="146" y="234">resume</text>
    <text x="628" y="224">returns or</text>
    <text x="628" y="239">is aborted</text>
  </g>

  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#5b6573">One task per CPU core is Running. A preemptive scheduler always runs the highest-priority Ready task.</text>
  <text x="380" y="403" text-anchor="middle" font-size="12" fill="#5b6573">Blocked and Suspended tasks use no CPU time. Suspend/resume can be applied from Ready or Blocked as well.</text>
</svg>
